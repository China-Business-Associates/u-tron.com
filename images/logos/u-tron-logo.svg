<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="utronBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023b9b" />
      <stop offset="50%" stop-color="#0345BF" />
      <stop offset="100%" stop-color="#0460f0" />
    </linearGradient>
    <linearGradient id="utronCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6fb" />
      <stop offset="100%" stop-color="#005bea" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0345BF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stylized U Icon with Orbit / Electron Arc -->
  <g transform="translate(10, 8)">
    <!-- Outer Orbital Ellipse -->
    <ellipse cx="32" cy="32" rx="28" ry="14" fill="none" stroke="url(#utronCyan)" stroke-width="3" transform="rotate(-28, 32, 32)" stroke-dasharray="160" stroke-dashoffset="15" opacity="0.85" />
    
    <!-- Electron Dot -->
    <circle cx="56" cy="20" r="4" fill="#00c6fb" filter="url(#subtleGlow)" />
    
    <!-- Bold 'U' Shield Structure -->
    <path d="M19 14 V33 C19 40 24 46 32 46 C40 46 45 40 45 33 V14 H37 V32 C37 35 35 38 32 38 C29 38 27 35 27 32 V14 Z" fill="url(#utronBlue)" />
    
    <!-- Central Core Glow Accent -->
    <circle cx="32" cy="25" r="3.5" fill="#00c6fb" />
  </g>

  <!-- Brand Typography: U-TRON -->
  <text x="82" y="44" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#071d49">U<tspan fill="#0345BF">-</tspan>TRON</text>

  <!-- Tagline / Subtitle -->
  <text x="84" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.2" fill="#586b88">LIGHTING &bull; ITS &bull; TELECOM</text>
  <text x="272" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#005bea">优创</text>
</svg>
