name: Verify & Deploy u-tron.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Validate HTML syntax
        run: npx --yes htmlhint "**/*.html"

      - name: Check internal links & asset paths
        run: npx --yes linkinator index.html --recurse --url-rewrite-search "^https://u-tron\.com/" --url-rewrite-replace "/" --retry-errors --retry-errors-count 3

  deploy:
    name: Publish to VPS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST || 'u-tron.com' }}
          REMOTE_USER: ${{ secrets.SSH_USER || 'cba_admin1' }}
          TARGET: "/home/cba_admin1/u-tron.com/"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git*' --exclude='.github*' \
            ./ "$REMOTE_USER@$REMOTE_HOST:$TARGET"
          rm -f ~/.ssh/deploy_key
